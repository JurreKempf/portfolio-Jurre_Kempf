<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <pattern id="grid1" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#BA8475" stroke-width="0.5" stroke-opacity="0.25"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="#f4ece6"/>
  <rect width="800" height="600" fill="url(#grid1)"/>
  
  <!-- Outer border with photo crop marks -->
  <rect x="30" y="30" width="740" height="540" fill="none" stroke="#1D1D1B" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="15" y1="30" x2="45" y2="30" stroke="#1D1D1B" stroke-width="1.5"/>
  <line x1="30" y1="15" x2="30" y2="45" stroke="#1D1D1B" stroke-width="1.5"/>
  <line x1="755" y1="30" x2="785" y2="30" stroke="#1D1D1B" stroke-width="1.5"/>
  <line x1="770" y1="15" x2="770" y2="45" stroke="#1D1D1B" stroke-width="1.5"/>
  <line x1="15" y1="570" x2="45" y2="570" stroke="#1D1D1B" stroke-width="1.5"/>
  <line x1="30" y1="555" x2="30" y2="585" stroke="#1D1D1B" stroke-width="1.5"/>
  <line x1="755" y1="570" x2="785" y2="570" stroke="#1D1D1B" stroke-width="1.5"/>
  <line x1="770" y1="555" x2="770" y2="585" stroke="#1D1D1B" stroke-width="1.5"/>

  <!-- Artistic Abstract Studio / Workspace Shapes -->
  <circle cx="400" cy="250" r="110" fill="#D2B48C" opacity="0.45"/>
  <path d="M 280 430 C 280 340, 520 340, 520 430 Z" fill="#BA8475" opacity="0.6"/>
  <circle cx="400" cy="245" r="55" fill="#1D1D1B" opacity="0.15"/>
  
  <!-- Discursive Sparkle / Star (matching Logo) -->
  <path d="M 640 140 C 640 170 650 170 670 170 C 650 170 640 170 640 200 C 640 170 630 170 610 170 C 630 170 640 170 640 140 Z" fill="#C00000"/>

  <!-- Label Badge -->
  <rect x="230" y="475" width="340" height="34" fill="#1D1D1B" rx="2"/>
  <text x="400" y="497" font-family="'Courier New', monospace" font-size="12" fill="#FFF7F3" text-anchor="middle" letter-spacing="2">
    [FIG 01 : PORTRET &amp; ATELIER]
  </text>
  <text x="400" y="530" font-family="sans-serif" font-size="11" fill="#7A6860" text-anchor="middle">
